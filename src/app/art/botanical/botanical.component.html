<svg
  [class]="pathCls"
  viewBox="0 0 200 200"
  aria-hidden="true"
  focusable="false"
>
  @switch (kind()) {
    @case ("sprig") {
      <!-- petitgrain / bergamot sprig -->
      <g class="botanical__stroke">
        <path d="M100 196 C96 150 96 96 100 30" />
        <path d="M100 150 C80 138 64 138 48 146" />
        <path d="M100 108 C118 96 132 92 146 96" />
        <path d="M100 68 C84 58 72 56 58 60" />
        <path d="M100 38 C116 30 128 28 140 32" />
        <path d="M56 148 C54 156 48 160 42 158 C38 158 36 154 38 150 C44 144 52 144 56 148" />
        <path d="M142 96 C146 90 152 88 156 92 C158 96 154 100 150 100 C146 102 142 100 142 96" />
      </g>
    }
    @case ("branch") {
      <!-- one sweeping branch, several leaf pairs -->
      <g class="botanical__stroke">
        <path d="M8 196 C44 180 66 140 96 66" />
        <path d="M96 66 C118 42 140 30 168 26" />
        <path d="M96 66 C78 44 72 30 74 16" />
        <path d="M54 172 C40 158 34 150 32 138" />
        <path d="M64 128 C50 116 44 108 42 98" />
        <path d="M76 94 C64 84 60 76 60 66" />
        <path d="M118 52 C130 44 138 40 148 42" />
        <path d="M142 38 C152 28 162 22 172 22" />
      </g>
    }
    @case ("grass") {
      <g class="botanical__stroke">
        <path d="M96 200 C96 150 92 100 84 34" />
        <path d="M104 200 C106 140 110 90 112 40" />
        <path d="M112 200 C120 150 128 110 140 78" />
        <path d="M88 200 C80 156 74 130 66 110" />
        <path d="M100 156 C106 146 112 142 120 140" />
        <path d="M100 120 C104 112 108 108 114 106" />
        <path d="M100 84 C104 76 108 72 114 70" />
      </g>
    }
    @case ("peony") {
      <!-- layered peony bloom -->
      <g class="botanical__stroke">
        <path d="M100 196 C100 168 100 140 100 128" />
        <g class="botanical__petals">
          @for (a of [0, 45, 90, 135, 180, 225, 270, 315]; track a) {
            <g [attr.transform]="'rotate(' + a + ' 100 66)'">
              <path d="M100 66 C112 62 118 46 118 30 C102 30 96 44 96 56 C92 44 86 30 82 30 C82 48 90 62 100 66 Z" />
            </g>
          }
        </g>
        <circle cx="100" cy="58" r="2.2" />
      </g>
    }
    @case ("blossom") {
      <!-- five-petal blossom cluster (jasmine / orange blossom) -->
      <g class="botanical__stroke">
        <path d="M100 200 C100 170 100 130 96 96" />
        <g [attr.transform]="'translate(0 -12)'">
          <g>
            @for (a of [0, 72, 144, 216, 288]; track a) {
              <g [attr.transform]="'rotate(' + a + ' 96 60)'">
                <path d="M96 66 C102 62 105 52 105 46 C96 46 93 52 93 58 C89 52 85 46 85 46 C85 54 90 63 96 66 Z" />
              </g>
            }
            <circle cx="96" cy="59" r="1.9" />
          </g>
        </g>
        <g>
          @for (a of [0, 120, 240]; track a) {
            <g [attr.transform]="'translate(70 108) rotate(' + a + ' 10 0)'">
              <path d="M10 0 C14 0 18 4 18 8 C14 8 11 6 10 3 C7 5 4 6 3 4 C5 1 8 0 10 0 Z" />
            </g>
          }
        </g>
      </g>
    }
    @case ("buds") {
      <g class="botanical__stroke">
        <path d="M96 200 C92 160 88 120 96 74" />
        <circle cx="89" cy="140" r="2" />
        <circle cx="96" cy="120" r="1.7" />
        <circle cx="93" cy="100" r="2" />
        <path d="M96 74 C104 64 118 60 130 62" />
        <path d="M96 108 C110 100 124 98 136 102" />
        <circle cx="134" cy="104" r="2.6" />
        <circle cx="124" cy="63" r="2.4" />
      </g>
    }
    @case ("citrus") {
      <!-- bergamot / mandarin fruit -->
      <g class="botanical__stroke">
        <path d="M30 196 C64 150 120 150 172 96" />
        <path d="M150 108 C158 92 172 84 186 84" />
        <path d="M150 108 C158 96 158 84 152 76" />
        <path d="M60 168 C48 160 44 150 46 140" />
        <circle cx="132" cy="122" r="17" fill="currentColor" opacity="0.07" />
        <circle cx="132" cy="122" r="17" />
        <circle cx="148" cy="148" r="13.5" fill="currentColor" opacity="0.05" />
        <circle cx="148" cy="148" r="13.5" />
        <path d="M132 122 m-3 0 a3 5 0 1 0 6 0 a3 5 0 1 0 -6 0" opacity="0.6" />
      </g>
    }
    @case ("moonflower") {
      <g class="botanical__stroke">
        <path d="M96 200 C98 150 104 110 116 88" />
        <g>
          @for (a of [0, 72, 144, 216, 288]; track a) {
            <g [attr.transform]="'rotate(' + a + ' 116 64)'">
              <path d="M116 88 C128 84 134 66 132 46 C118 52 114 68 116 88 Z" />
            </g>
          }
        </g>
        <circle cx="116" cy="66" r="2" />
        <path d="M96 128 C76 118 62 116 50 120" />
        <circle cx="48" cy="121" r="3.2" fill="currentColor" opacity="0.06" />
        <circle cx="48" cy="121" r="3.2" />
      </g>
    }
    @case ("iris") {
      <g class="botanical__stroke">
        <path d="M60 200 C66 160 72 118 66 74" />
        <path d="M100 200 C98 170 98 132 104 100" />
        <path d="M132 200 C128 166 132 134 140 110" />
        <path d="M66 74 C54 62 48 52 50 40" />
        <path d="M66 74 C76 66 82 58 82 46" />
        <path d="M104 100 C94 92 88 82 90 70" />
        <path d="M104 100 C114 90 120 80 118 70" />
        <path d="M140 110 C128 104 124 94 126 82" />
        <path d="M140 110 C150 102 154 92 152 80" />
      </g>
    }
    @case ("figleaf") {
      <g class="botanical__stroke">
        <path d="M30 198 C54 160 76 130 106 96" />
        <path d="M66 160 C56 146 52 130 54 114" />
        <path d="M82 138 C76 124 74 110 78 96" />
        <path d="M86 170 C72 158 66 144 68 128" />
        <path d="M30 198 C52 190 74 170 86 170" />
        <path d="M106 96 C96 84 90 74 92 62" />
      </g>
    }
    @case ("amber") {
      <!-- translucent amber resin pebbles -->
      <g class="botanical__stroke">
        <path d="M104 200 C112 190 118 176 114 162 C138 156 150 142 152 124 C166 118 172 102 168 88 C148 94 138 108 138 126 C120 132 108 144 108 162 C96 168 90 182 96 194 Z" fill="currentColor" opacity="0.12" />
        <path d="M84 172 C90 164 94 152 92 142 C80 138 70 128 68 116 C56 118 48 110 50 100 C60 102 66 110 74 114 C80 126 86 134 96 140 C98 152 94 162 88 168" fill="currentColor" opacity="0.08" />
      </g>
    }
  }
</svg>
