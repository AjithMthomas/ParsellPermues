<svg
  class="flacon"
  viewBox="0 0 240 460"
  aria-hidden="true"
  focusable="false"
>
  <defs>
    <linearGradient
      [attr.id]="gid + '-liq'"
      x1="0"
      y1="0"
      x2="0"
      y2="1"
      gradientUnits="objectBoundingBox"
    >
      <stop offset="0" stop-color="var(--liq-1)" />
      <stop offset="0.55" stop-color="var(--liq-2)" />
      <stop offset="1" stop-color="var(--liq-3)" />
    </linearGradient>

    <linearGradient
      [attr.id]="gid + '-glass'"
      x1="0"
      y1="0"
      x2="1"
      y2="0"
      gradientUnits="objectBoundingBox"
    >
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34" />
      <stop offset="0.28" stop-color="#ffffff" stop-opacity="0.02" />
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient
      [attr.id]="gid + '-plinth'"
      x1="0"
      y1="0"
      x2="0"
      y2="1"
      gradientUnits="objectBoundingBox"
    >
      <stop offset="0" stop-color="#FCFBF8" stop-opacity="0.95" />
      <stop offset="1" stop-color="#EDE7DC" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient
      [attr.id]="gid + '-stopper'"
      x1="0"
      y1="0"
      x2="1"
      y2="0"
      gradientUnits="objectBoundingBox"
    >
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42" />
      <stop offset="0.5" stop-color="#FCFBF8" stop-opacity="0.08" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.3" />
    </linearGradient>

    <clipPath [attr.id]="gid + '-bodyclip'">
      <path
        d="M103 124 C86 124 74 140 74 170 L74 424 L166 424 L166 170 C166 140 154 124 137 124 Z"
      />
    </clipPath>
  </defs>

  <!-- rear light inside the glass -->
  <ellipse cx="120" cy="300" rx="40" ry="92" fill="#ffffff" opacity="0.05" />

  <!-- glass foot -->
  <rect
    x="62"
    y="418"
    width="116"
    height="24"
    rx="5"
    [attr.fill]="'url(#' + gid + '-plinth)'"
    stroke="rgba(48,36,29,0.08)"
    stroke-width="0.6"
  />

  <!-- liquid -->
  <g [attr.clip-path]="'url(#' + gid + '-bodyclip)'">
    <rect x="70" y="140" width="100" height="290" [attr.fill]="'url(#' + gid + '-liq)'" opacity="0.92" />
    <!-- light passing through the liquid -->
    <ellipse cx="120" cy="352" rx="26" ry="60" fill="#ffffff" opacity="0.07" />
    <ellipse cx="120" cy="352" rx="13" ry="60" fill="#ffffff" opacity="0.06" />
    <!-- moving refraction band -->
    <g class="flacon__band" opacity="0.5">
      <path d="M40 424 L150 424 L106 128 L52 128 Z" fill="#ffffff" opacity="0.16" />
      <path d="M70 424 L120 424 L86 128 L56 128 Z" fill="#ffffff" opacity="0.1" />
    </g>
  </g>

  <!-- liquid top light line -->
  <g [attr.clip-path]="'url(#' + gid + '-bodyclip)'" opacity="0.9">
    <path d="M76 156 C96 150 144 150 164 156" stroke="#ffffff" stroke-width="1.1" fill="none" opacity="0.5" />
    <path d="M76 162 C96 157 144 157 164 162" stroke="#ffffff" stroke-width="0.7" fill="none" opacity="0.28" />
  </g>

  <!-- bottle body — clear glass silhouette over the liquid -->
  <path
    d="M103 124 C86 124 74 140 74 170 L74 424 L166 424 L166 170 C166 140 154 124 137 124 Z"
    [attr.fill]="'url(#' + gid + '-glass)'"
  />

  <!-- body facet & rim light lines -->
  <line x1="77.2" y1="174" x2="77.2" y2="418" stroke="#ffffff" stroke-width="1.1" opacity="0.5" />
  <line x1="162.8" y1="174" x2="162.8" y2="418" stroke="rgba(48,36,29,0.1)" stroke-width="1" />
  <line x1="98" y1="178" x2="98" y2="414" stroke="#ffffff" stroke-width="1" opacity="0.13" />
  <line x1="142" y1="178" x2="142" y2="414" stroke="#ffffff" stroke-width="1" opacity="0.11" />
  <rect x="84" y="184" width="9" height="228" rx="4.5" fill="#ffffff" opacity="0.05" />

  <!-- neck -->
  <rect x="103" y="96" width="34" height="30" [attr.fill]="'url(#' + gid + '-glass)'" />
  <line x1="104.4" y1="100" x2="104.4" y2="122" stroke="#ffffff" stroke-width="0.8" opacity="0.4" />
  <line x1="135.6" y1="100" x2="135.6" y2="122" stroke="rgba(48,36,29,0.1)" stroke-width="0.8" />

  <!-- collar -->
  <rect x="95" y="84" width="50" height="14" rx="3.5" fill="#FCFBF8" opacity="0.86" stroke="rgba(48,36,29,0.12)" stroke-width="0.6" />
  <line x1="96.4" y1="90.4" x2="143.6" y2="90.4" stroke="#B89452" stroke-width="0.6" opacity="0.5" />
  <line x1="97" y1="86.5" x2="143" y2="86.5" stroke="#ffffff" stroke-width="0.9" opacity="0.9" />

  <!-- stopper -->
  <path
    d="M101 84 L101 44 Q101 30 111 30 L129 30 Q139 30 139 44 L139 84 Z"
    [attr.fill]="'url(#' + gid + '-stopper)'"
    stroke="rgba(48,36,29,0.1)"
    stroke-width="0.6"
  />
  <path d="M104 84 L104 44 Q104 33 111 32.6" stroke="#ffffff" stroke-width="1" opacity="0.8" fill="none" />
  <line x1="112" y1="34" x2="112" y2="81" stroke="#ffffff" stroke-width="0.8" opacity="0.22" />
  <line x1="128" y1="34" x2="128" y2="81" stroke="#ffffff" stroke-width="0.8" opacity="0.14" />

  <!-- label plate -->
  <g>
    <rect x="88.4" y="263.4" width="66" height="48" rx="2.5" fill="rgb(48 36 29 / 0.14)" />
    <rect x="87" y="262" width="66" height="48" rx="2.5" fill="#FCFBF8" opacity="0.97" stroke="#B89452" stroke-opacity="0.45" stroke-width="0.6" />
    <rect x="88.6" y="263.6" width="62.8" height="44.8" rx="1.5" fill="none" stroke="rgba(48,36,29,0.07)" stroke-width="0.5" />
    <text
      x="120"
      y="283.5"
      text-anchor="middle"
      style="font-family: 'Cormorant Garamond', serif; font-weight: 500"
      font-size="11.5"
      letter-spacing="2.1"
      fill="#30241D"
    >
      PARADISA
    </text>
    <line x1="104" y1="291" x2="136" y2="291" stroke="#B89452" stroke-width="0.6" opacity="0.65" />
    <text
      x="120"
      y="303"
      text-anchor="middle"
      style="font-family: 'Montserrat', sans-serif; font-weight: 500"
      font-size="5.6"
      letter-spacing="1.6"
      fill="#4A3729"
      opacity="0.85"
    >
      {{ fragrance()?.code ?? 'Nº1' }} · EAU DE PARFUM
    </text>
  </g>

  <!-- champagne hairline catch on the body edge -->
  <path
    d="M118 232 C132 232 146 246 146 258"
    stroke="#ffffff"
    stroke-width="0.7"
    fill="none"
    opacity="0.55"
  />
</svg>
