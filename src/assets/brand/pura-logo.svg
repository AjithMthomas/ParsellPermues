<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" fill="none">
  <!-- Pura Perfumes Luxury Wordmark -->
  <defs>
    <linearGradient id="puraGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A24D" />
      <stop offset="50%" stop-color="#E8D196" />
      <stop offset="100%" stop-color="#B88E3E" />
    </linearGradient>
  </defs>
  <!-- Stylized leaf motif flourish -->
  <path d="M72 74 C60 76 54 86 52 94 C58 92 68 88 74 80 C78 74 76 72 72 74 Z" fill="url(#puraGold)" opacity="0.85" />
  <path d="M76 78 C84 84 92 88 102 90 C96 82 90 78 82 76 C78 75 75 76 76 78 Z" fill="url(#puraGold)" opacity="0.75" />
  
  <!-- "pura" typography -->
  <text x="160" y="68" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="62" font-weight="400" letter-spacing="4" fill="url(#puraGold)">pura</text>
  
  <!-- Subtitle "PERFUMES" -->
  <text x="160" y="96" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="10.5" font-weight="400" letter-spacing="9" fill="#7A6548">PERFUMES</text>
  
  <!-- Flank hairline flourishes -->
  <line x1="40" y1="93" x2="88" y2="93" stroke="url(#puraGold)" stroke-width="0.8" opacity="0.4" />
  <line x1="232" y1="93" x2="280" y2="93" stroke="url(#puraGold)" stroke-width="0.8" opacity="0.4" />
</svg>
